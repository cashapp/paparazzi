# Layoutlib versions Paparazzi is verified against. Single source of truth for:
#   - the Gradle plugin (minimum layoutlib-api, known-version warning)
#   - the runtime (ICU data file per version, via LayoutlibCompat)
#   - LayoutlibCompatibilityTest (renders against every version listed here)
#
# Do not edit by hand: add/refresh entries with
#   ./gradlew verifyLayoutlibVersion --layoutlib-version=<version> --write
# See LAYOUTLIB.md.
#
# Keys:
#   <version>.icu              ICU data file shipped in layoutlib-runtime/data/icu (identical on every OS)
#   <version>.minLayoutlibApi  Minimum layoutlib-api satisfying the layoutlib jar's API references.
#                              Omitted when Paparazzi's pinned layoutlib-api already suffices.
#
# The default layoutlib (libs.versions.layoutlib in libs.versions.toml) must be listed; the build fails otherwise.

