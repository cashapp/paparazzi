GROUP=app.cash.paparazzi
VERSION_NAME=2.0.0-SNAPSHOT

POM_URL=https://github.com/cashapp/paparazzi/
POM_SCM_URL=https://github.com/cashapp/paparazzi/
POM_SCM_CONNECTION=scm:git:git://github.com/cashapp/paparazzi.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/cashapp/paparazzi.git

POM_LICENCE_NAME=The Apache Software License, Version 2.0
POM_LICENCE_URL=http://www.apache.org/licenses/LICENSE-2.0.txt
POM_LICENCE_DIST=repo

POM_DEVELOPER_ID=cashapp
POM_DEVELOPER_NAME=CashApp
POM_DEVELOPER_URL=https://github.com/cashapp/

SONATYPE_HOST=CENTRAL_PORTAL
RELEASE_SIGNING_ENABLED=true
SONATYPE_AUTOMATIC_RELEASE=true

org.gradle.caching=true
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx4g

# Some submodules use newer SDK levels for testing.
android.suppressUnsupportedCompileSdk=UpsideDownCakePrivacySandbox

# Signals to our own plugin that we are building within the repo.
app.cash.paparazzi.internal=true

# Dokka
org.jetbrains.dokka.experimental.gradle.pluginMode=V2Enabled

# Enables using screenshotTest source set for Paparazzi test isolation. This is an experimental feature and may be removed in the future.
# Paparazzi's isolated source set is built on AGP's screenshot-test source set, so AGP's own flag is required too.
android.experimental.enableScreenshotTest=true
app.cash.paparazzi.enableScreenshotTestSourceSet=true
