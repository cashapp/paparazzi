import org.jetbrains.kotlin.gradle.dsl.JvmTarget

buildscript {
  repositories {
    mavenCentral()
    google()
    gradlePluginPortal()
  }

  dependencies {
    classpath libs.plugin.kotlin
    classpath libs.plugin.android
    classpath libs.plugin.buildConfig
    classpath libs.plugin.spotless
  }
}

subprojects {
  repositories {
    mavenCentral()
    google()
  }

  tasks.withType(JavaCompile).configureEach {
    sourceCompatibility = libs.versions.javaTarget.get()
    targetCompatibility = libs.versions.javaTarget.get()
  }

  tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinJvmCompile).configureEach {
    compilerOptions {
      jvmTarget = JvmTarget.fromTarget(libs.versions.javaTarget.get())
    }
  }
}

// paparazzi-gradle-plugin is also a root-build subproject and is formatted there.
configure(subprojects.findAll { it.name != 'paparazzi-gradle-plugin' }) {
  apply plugin: 'com.diffplug.spotless'
  spotless {
    kotlin {
      target("src/**/*.kt")
      ktlint(libs.ktlint.core.get().version)
        .setEditorConfigPath(rootProject.file("../.editorconfig"))
    }
  }
}
