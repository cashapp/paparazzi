plugins {
  id 'com.android.library'
  id 'org.jetbrains.kotlin.plugin.compose'
  id 'app.cash.paparazzi'
}

android {
  namespace = 'app.cash.paparazzi.plugin.test'
  compileSdk = libs.versions.compileSdk.get() as int
  defaultConfig {
    minSdk = libs.versions.minSdk.get() as int
  }
  compileOptions {
    sourceCompatibility = libs.versions.javaTarget.get()
    targetCompatibility = libs.versions.javaTarget.get()
  }
  buildFeatures {
    compose = true
  }
}

dependencies {
  // Exercise the current Compose UI rather than an older version selected transitively.
  implementation libs.androidx.compose.ui.android
  implementation libs.composeUi.material3.android
  implementation libs.composeUi.material
  implementation libs.composeUi.material.icons
  implementation libs.androidx.appcompat

  testImplementation libs.truth
}

// Inspect the collector's internal model in the Android fixture, where Compose's
// generated resource classes are available.
tasks.matching { it.name == "compileDebugUnitTestKotlin" }.configureEach {
  compilerOptions.freeCompilerArgs.add(provider {
    def paparazziJar = libraries.files.find {
      it.name.startsWith("paparazzi-") && it.name.endsWith(".jar")
    }
    "-Xfriend-paths=${paparazziJar.absolutePath}"
  })
}
