plugins {
  id 'com.android.library'
  id 'org.jetbrains.kotlin.plugin.compose'
  id 'app.cash.paparazzi'
}

android {
  namespace = 'app.cash.paparazzi.plugin.test'
  compileSdk = libs.versions.compileSdk.get() as int
  defaultConfig {
    minSdk = libs.versions.minSdk.get() as int
  }
  compileOptions {
    sourceCompatibility = libs.versions.javaTarget.get()
    targetCompatibility = libs.versions.javaTarget.get()
  }
  buildFeatures {
    compose = true
  }
}

dependencies {
  implementation libs.composeUi.material

  testImplementation 'com.squareup.leakcanary:leakcanary-object-watcher:2.7'
  testImplementation 'com.squareup.leakcanary:shark:2.7'
  testImplementation 'com.squareup.leakcanary:shark-android:2.7'
}
