import org.gradle.api.tasks.testing.Test
import org.gradle.process.CommandLineArgumentProvider

class JacocoFixtureArgumentProvider implements CommandLineArgumentProvider {
  private final String propertyName

  JacocoFixtureArgumentProvider(String propertyName) {
    this.propertyName = propertyName
  }

  @Override
  Iterable<String> asArguments() {
    return ["-Dapp.cash.paparazzi.test.${propertyName}=present"]
  }
}

plugins {
  id 'com.android.library'
  id 'org.jetbrains.kotlin.plugin.compose'
  id 'app.cash.paparazzi'
  id 'jacoco'
}

android {
  namespace = 'app.cash.paparazzi.plugin.test'
  compileSdk = libs.versions.compileSdk.get() as int
  defaultConfig {
    minSdk = libs.versions.minSdk.get() as int
  }
  compileOptions {
    sourceCompatibility = libs.versions.javaTarget.get()
    targetCompatibility = libs.versions.javaTarget.get()
  }
  buildFeatures {
    compose = true
  }
}

dependencies {
  implementation libs.composeUi.material
}

afterEvaluate {
  tasks.named('testDebugUnitTest', Test) {
    jvmArgumentProviders.add(new JacocoFixtureArgumentProvider('firstArgumentProvider'))
    jvmArgumentProviders.add(new JacocoFixtureArgumentProvider('secondArgumentProvider'))
  }
}

tasks.register('assertPaparazziJvmArgumentProviders') {
  doLast {
    def unitTestTask = tasks.named('testDebugUnitTest', Test).get()
    def paparazziTestTask = tasks.named('testPaparazziDebug', Test).get()
    def unitTestProviderCounts = unitTestTask.jvmArgumentProviders.countBy { it.class }
    def paparazziProviderCounts = paparazziTestTask.jvmArgumentProviders.countBy { it.class }

    assert paparazziProviderCounts == unitTestProviderCounts:
      "Expected matching JVM argument provider type counts. " +
        "Unit test: ${unitTestProviderCounts}; Paparazzi: ${paparazziProviderCounts}"
    assert paparazziProviderCounts[JacocoFixtureArgumentProvider] == 2
  }
}
