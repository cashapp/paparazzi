apply plugin: 'org.jetbrains.kotlin.jvm'
apply plugin: 'java-gradle-plugin'
apply plugin: 'com.github.gmazzo.buildconfig'

// This module is included in two projects:
// - In the root project where it's released as one of our artifacts
// - In build-logic project where we can use it for the test-schema and samples.
//
// We only want to publish when it's being built in the root project.
if (rootProject.name == 'paparazzi-root') {
  apply plugin: 'com.vanniktech.maven.publish'
}

gradlePlugin {
  plugins {
    paparazzi {
      id = 'app.cash.paparazzi'
      implementationClass = 'app.cash.paparazzi.gradle.PaparazziPlugin'
    }
  }
}

configurations {
  fixtureClasspath
  testImplementation.extendsFrom(fixtureClasspath)
}

tasks.named('pluginUnderTestMetadata').configure {
  pluginClasspath.from(configurations.fixtureClasspath)
}

dependencies {
  compileOnly gradleApi()
  compileOnly libs.plugin.kotlin
  compileOnly libs.plugin.android

  implementation platform(libs.kotlin.bom)
  implementation(libs.tools.sdkCommon) {
    because "SymbolUtils.getPackageNameFromManifest removed in AGP 7.0.  Replace?"
  }
  implementation libs.moshi.core
  implementation libs.moshi.adapters
  implementation libs.moshi.kotlinReflect

  testImplementation libs.junit
  testImplementation libs.truth

  fixtureClasspath libs.plugin.kotlin
  fixtureClasspath libs.plugin.kotlin.compose
  fixtureClasspath libs.plugin.android
}

def layoutlibCompatFile = layout.projectDirectory.file("../gradle/layoutlib-compat.properties")
def layoutlibCompat = new Properties()
layoutlibCompatFile.asFile.withInputStream { layoutlibCompat.load(it) }
def layoutlibKnownVersions = layoutlibCompat.stringPropertyNames()
  .findAll { it.endsWith(".icu") }
  .collect { it.substring(0, it.length() - ".icu".length()) }
  .sort(false)
def layoutlibDefault = libs.versions.layoutlib.get()
if (!layoutlibKnownVersions.contains(layoutlibDefault)) {
  throw new GradleException(
    "Default layoutlib $layoutlibDefault (libs.versions.toml) is not listed in ${layoutlibCompatFile.asFile}. " +
      "Run ./gradlew verifyLayoutlibVersion --layoutlib-version=$layoutlibDefault --write (see LAYOUTLIB.md)"
  )
}
def kotlinString = { "\"" + it + "\"" }
def layoutlibMinApiEntries = layoutlibKnownVersions
  .findAll { layoutlibCompat.getProperty("${it}.minLayoutlibApi") != null }
  .collect { "${kotlinString(it)} to ${kotlinString(layoutlibCompat.getProperty("${it}.minLayoutlibApi"))}" }
def layoutlibBundledSdkEntries = layoutlibKnownVersions.collect { version ->
  def sdk = layoutlibCompat.getProperty("${version}.sdk")
  if (sdk == null) {
    throw new GradleException("$version has no .sdk entry in ${layoutlibCompatFile.asFile}. Run ./gradlew verifyLayoutlibVersion --layoutlib-version=$version --write")
  }
  "${kotlinString(version)} to ${sdk as int}"
}

buildConfig {
  useKotlinOutput {
    internalVisibility = true
    topLevelConstants = true
  }

  packageName('app.cash.paparazzi.gradle')
  buildConfigField("String", "VERSION", "\"${project.version}\"")
  buildConfigField("String", "NATIVE_LIB_VERSION", "\"${libs.versions.layoutlib.get()}\"")
  buildConfigField(
    "kotlin.collections.List<kotlin.String>",
    "LAYOUTLIB_KNOWN_VERSIONS",
    expression("listOf(${layoutlibKnownVersions.collect(kotlinString).join(", ")})".toString())
  )
  buildConfigField(
    "kotlin.collections.Map<kotlin.String, kotlin.String>",
    "LAYOUTLIB_MIN_API",
    expression("mapOf(${layoutlibMinApiEntries.join(", ")})".toString())
  )
  buildConfigField(
    "kotlin.collections.Map<kotlin.String, kotlin.Int>",
    "LAYOUTLIB_BUNDLED_SDK",
    expression("mapOf(${layoutlibBundledSdkEntries.join(", ")})".toString())
  )
  buildConfigField("String", "JUNIT_PLATFORM_LAUNCHER", "\"${libs.junit.platform.launcher.get()}\"")
  buildConfigField("String", "PAPARAZZI_JUNIT_VINTAGE_COORDINATES", "\"app.cash.paparazzi:paparazzi-junit-vintage:${project.version}\"")
  buildConfigField("String", "PAPARAZZI_JUNIT_JUPITER_COORDINATES", "\"app.cash.paparazzi:paparazzi-junit-jupiter:${project.version}\"")
}

tasks.withType(Test).configureEach {
  // These are referenced with relative paths in src/test/projects/test.settings.gradle.
  // They need to be declared on the Test task to make sure it runs with the new files.
  inputs.file(rootProject.layout.projectDirectory.file("gradle/libs.versions.toml"))
    .withPropertyName("libs.versions.toml")
  inputs.dir(rootProject.layout.buildDirectory.dir("localMaven"))
    .withPropertyName("localMaven")
  dependsOn(':paparazzi:publishMavenPublicationToProjectLocalMavenRepository')
  dependsOn(':paparazzi-layoutlib-shim-api:publishMavenPublicationToProjectLocalMavenRepository')
  dependsOn(':paparazzi-layoutlib-shim-16-0:publishMavenPublicationToProjectLocalMavenRepository')
  dependsOn(':paparazzi-layoutlib-shim-16-2:publishMavenPublicationToProjectLocalMavenRepository')
  dependsOn(':paparazzi-layoutlib-shim-17:publishMavenPublicationToProjectLocalMavenRepository')
  inputs.file(layoutlibCompatFile).withPropertyName("layoutlibCompat").withPathSensitivity(PathSensitivity.NONE)
  def versionsUnderTest = providers.gradleProperty("paparazzi.layoutlib.versionsUnderTest")
  if (versionsUnderTest.present) {
    systemProperty("paparazzi.layoutlib.versionsUnderTest", versionsUnderTest.get())
  }
  dependsOn(':paparazzi-junit-platform:publishMavenPublicationToProjectLocalMavenRepository')
  dependsOn(':paparazzi-junit-vintage:publishMavenPublicationToProjectLocalMavenRepository')
  dependsOn(':paparazzi-junit-jupiter:publishMavenPublicationToProjectLocalMavenRepository')
}

// When cleaning this project, we also want to clean the test projects.
tasks.named("clean").configure { cleaner ->
  cleaner.doFirst {
    project.file('src/test/projects').eachFile { root ->
      new File(root, '.gradle').deleteDir()
      new File(root, 'build').deleteDir()
    }
  }
}
